server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Assets statiques avec cache long
    # Exclusion de /admin/* : ces fichiers sont servis par le backend Express, pas par nginx.
    # Exclusion de /docs/* : route React Router, ne pas servir de fichiers statiques
    location ~* ^(?!/admin/|/docs/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy API REST vers le backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 150m;
    }

    # Proxy dashboard admin + fichiers statiques servis par Express
    location /admin {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # URL propre : /admin/login → /admin/login.html (sans extension visible)
    location = /admin/login {
        proxy_pass         http://127.0.0.1:3005/admin/login.html;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Redirection permanente : anciennes URLs .html → URLs propres
    location = /admin/login.html {
        return 301 /admin/login;
    }

    # Proxy Socket.io (WebSocket + polling)
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Route React pour la documentation - servir index.html
    location /docs {
        try_files $uri /index.html;
    }

    # Proxy Panel WhatsApp (page QR servie par le backend Express)
    location = /whatsapp-panel {
        proxy_pass         http://127.0.0.1:3005/index.html;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA — toutes les routes non trouvées → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
