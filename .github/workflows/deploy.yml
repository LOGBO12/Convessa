name: 🚀 Deploy Frontend — VPS

on:
  push:
    branches: [ diegue ]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📡 Connect & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Deploy Frontend — $(date '+%Y-%m-%d %H:%M:%S')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            cd /var/www/convessa/frontend

            echo "📥 Pull branch diegue..."
            git fetch origin
            git checkout diegue
            git reset --hard origin/diegue

            echo "🐳 Rebuild & restart frontend container..."
            cd /var/www/convessa
            docker compose up -d --build frontend

            echo "🩺 Health check..."
            sleep 5
            if docker ps | grep -q convessa_frontend; then
              echo "✅ Frontend opérationnel !"
            else
              echo "❌ Frontend en échec — voir logs :"
              docker logs convessa_frontend --tail 20
              exit 1
            fi
